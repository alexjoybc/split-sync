name: stopwatch EAS preview

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "apps/stopwatch/**"

concurrency:
  group: stopwatch-eas-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: EAS Update preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to the split-sync Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create preview
        uses: expo/expo-github-action/preview@v8
        with:
          # GitHub Actions checks out a temporary merge branch for pull_request
          # triggers, so we overwrite the branch name `--auto` would infer with
          # the PR's actual head branch.
          command: eas update --auto --branch ${{ github.event.pull_request.head.ref }}
          working-directory: apps/stopwatch
