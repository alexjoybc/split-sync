name: stopwatch EAS preview

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "apps/stopwatch/**"

concurrency:
  group: stopwatch-eas-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: EAS Update preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for EXPO_TOKEN
        id: token_check
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN not set — skipping EAS Update preview"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: steps.token_check.outputs.has_token == 'true'
        with:
          version: 11.23.0

      - name: Setup Node
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup EAS
        if: steps.token_check.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.token_check.outputs.has_token == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create preview
        if: steps.token_check.outputs.has_token == 'true'
        uses: expo/expo-github-action/preview@v8
        with:
          # GitHub Actions checks out a temporary merge branch for pull_request
          # triggers, so we overwrite the branch name `--auto` would infer with
          # the PR's actual head branch.
          command: eas update --auto --branch ${{ github.event.pull_request.head.ref }}
          working-directory: apps/stopwatch
