name: Mobile Tracker — Play Store release

# Builds a signed .aab from apps/mobile and uploads it to the Play Store
# internal testing track on every push to main that touches the mobile app.
#
# No EAS Build is used. The pipeline is:
#   expo prebuild  →  patch build.gradle  →  Gradle bundleRelease  →  Play Store upload
#
# Required GitHub secrets (one-time setup in repo Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64     base64-encoded upload keystore  (keytool output)
#   ANDROID_KEY_ALIAS           key alias used when the keystore was created
#   ANDROID_STORE_PASSWORD      keystore password
#   ANDROID_KEY_PASSWORD        key password
#   PLAY_STORE_JSON_KEY         raw JSON of the Google Play service account key
#                               (NOT base64 — paste the file contents directly)
#
# First-time Play Store setup:
#   1. Create a Google Cloud service account with Android Publisher API enabled.
#   2. Download its JSON key and store it as PLAY_STORE_JSON_KEY.
#   3. Grant "Release Manager" to the service account in Play Console.
#   4. Upload the very first .aab manually via Play Console (API requirement).
#   After step 4, all subsequent uploads happen automatically through this workflow.
#
# android/ is gitignored and regenerated by expo prebuild on every run.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch: {}

concurrency:
  # Only one release build at a time; never cancel an in-progress upload.
  group: mobile-release
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build signed .aab and upload to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # android/ is gitignored; generate it from app.json + config plugins.
      # --no-install skips a redundant npm install inside the prebuild step.
      - name: Generate native Android project (expo prebuild)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_DOTENV: 1

      # Decode the binary keystore from base64.
      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d \
            > "$RUNNER_TEMP/splitsync-upload.keystore"

      # Read versionName from package.json before patching so it's available for sed.
      - name: Read version name
        id: ver
        run: |
          echo "name=$(node -p "require('./apps/mobile/package.json').version")" \
            >> "$GITHUB_OUTPUT"

      # The generated build.gradle uses the debug keystore for release builds.
      # Patch it to:
      #   • inject versionCode / versionName directly (simpler than Gradle -P flags)
      #   • add a release signingConfig block at the correct nesting level
      #   • switch the release buildType to use that signingConfig
      #
      # The brace-counting helper avoids the non-greedy regex trap where .*? stops
      # at the first } it finds (the inner debug {} closing brace) instead of the
      # outer signingConfigs {} closing brace.
      - name: Patch build.gradle for release signing
        working-directory: apps/mobile/android
        run: |
          # 1. Stamp versionCode and versionName with real values via sed.
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.ver.outputs.name }}"/' app/build.gradle

          # 2+3. Add release signingConfig and rewire the release buildType via Python.
          python3 - <<'PYEOF'
          path = "app/build.gradle"
          with open(path) as f:
              src = f.read()

          def find_block_end(text, start):
              """Return index of the } that closes the { at position start."""
              depth = 0
              for i in range(start, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
              return -1

          release_cfg = """
          release {
              storeFile file(findProperty('SPLITSYNC_STORE_FILE') ?: 'debug.keystore')
              storePassword findProperty('SPLITSYNC_STORE_PASSWORD') ?: ''
              keyAlias findProperty('SPLITSYNC_KEY_ALIAS') ?: ''
              keyPassword findProperty('SPLITSYNC_KEY_PASSWORD') ?: ''
          }"""

          # 2. Inject release signingConfig at the correct level inside signingConfigs {}.
          sc_pos = src.find('signingConfigs {')
          sc_brace = src.index('{', sc_pos)
          sc_end = find_block_end(src, sc_brace)
          sc_inner = src[sc_brace + 1:sc_end]
          if 'release {' not in sc_inner:
              new_sc_inner = sc_inner.rstrip() + release_cfg + '\n    '
              src = src[:sc_brace + 1] + new_sc_inner + src[sc_end:]

          # 3. Switch buildTypes.release to use signingConfigs.release.
          bt_pos = src.find('buildTypes {')
          bt_brace = src.index('{', bt_pos)
          bt_end = find_block_end(src, bt_brace)
          bt_inner = src[bt_brace + 1:bt_end]

          rel_pos = bt_inner.find('release {')
          if rel_pos != -1:
              rel_brace = bt_inner.index('{', rel_pos)
              rel_end = find_block_end(bt_inner, rel_brace)
              rel_inner = bt_inner[rel_brace + 1:rel_end]
              new_rel_inner = rel_inner.replace(
                  'signingConfig signingConfigs.debug',
                  'signingConfig signingConfigs.release',
                  1,
              )
              new_bt = bt_inner[:rel_brace + 1] + new_rel_inner + bt_inner[rel_end:]
              src = src[:bt_brace + 1] + new_bt + src[bt_end:]

          with open(path, 'w') as f:
              f.write(src)

          print('build.gradle patched OK')
          PYEOF

      # Write signing vars into gradle.properties (gitignored, never committed).
      - name: Inject signing vars into gradle.properties
        working-directory: apps/mobile/android
        run: |
          cat >> gradle.properties <<EOF
          SPLITSYNC_STORE_FILE=$RUNNER_TEMP/splitsync-upload.keystore
          SPLITSYNC_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}
          SPLITSYNC_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          SPLITSYNC_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # Run the JS bundle step directly via Expo CLI so Metro's output is visible.
      # Gradle swallows the worker subprocess output; this step surfaces any Metro
      # error before Gradle runs. If this step passes, the issue is native-only.
      - name: Bundle JS (expo export:embed)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          EXPO_CLI=$(node --print \
            "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })")
          mkdir -p android/app/build/intermediates/assets/release/mergeReleaseAssets
          mkdir -p android/app/build/generated/res/react/release
          node "$EXPO_CLI" export:embed \
            --platform android \
            --entry-file index.ts \
            --bundle-output android/app/build/intermediates/assets/release/mergeReleaseAssets/index.android.bundle \
            --assets-dest android/app/build/generated/res/react/release \
            --dev false \
            --minify true

      - name: Build release .aab
        working-directory: apps/mobile/android
        # SKIP_BUNDLING reuses the pre-built bundle from the step above.
        # EXPO_PUBLIC_* are still passed so Gradle env matches if needed.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SKIP_BUNDLING: true
        run: ./gradlew bundleRelease

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: org.splitsync.tracker
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # Keep the .aab as a workflow artifact for 30 days (audit / manual sideload).
      - name: Archive .aab
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splitsync-tracker-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
