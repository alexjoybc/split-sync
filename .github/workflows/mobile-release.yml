name: Mobile Tracker — Play Store release

# Builds a signed .aab from apps/mobile and uploads it to the Play Store
# internal testing track on every push to main that touches the mobile app.
#
# No EAS Build is used. The pipeline is:
#   expo prebuild  →  patch build.gradle  →  Gradle bundleRelease  →  Play Store upload
#
# Required GitHub secrets (one-time setup in repo Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64     base64-encoded upload keystore  (keytool output)
#   ANDROID_KEY_ALIAS           key alias used when the keystore was created
#   ANDROID_STORE_PASSWORD      keystore password
#   ANDROID_KEY_PASSWORD        key password
#   PLAY_STORE_JSON_KEY         raw JSON of the Google Play service account key
#                               (NOT base64 — paste the file contents directly)
#
# First-time Play Store setup:
#   1. Create a Google Cloud service account with Android Publisher API enabled.
#   2. Download its JSON key and store it as PLAY_STORE_JSON_KEY.
#   3. Grant "Release Manager" to the service account in Play Console.
#   4. Upload the very first .aab manually via Play Console (API requirement).
#   After step 4, all subsequent uploads happen automatically through this workflow.
#
# android/ is gitignored and regenerated by expo prebuild on every run.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch: {}

concurrency:
  # Only one release build at a time; never cancel an in-progress upload.
  group: mobile-release
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build signed .aab and upload to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # android/ is gitignored; generate it from app.json + config plugins.
      # --no-install skips a redundant npm install inside the prebuild step.
      - name: Generate native Android project (expo prebuild)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_DOTENV: 1

      # Decode the binary keystore from base64.
      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d \
            > "$RUNNER_TEMP/splitsync-upload.keystore"

      # The generated build.gradle uses the debug keystore for release builds.
      # Patch it to:
      #   • add a release signingConfig driven by gradle.properties
      #   • switch the release buildType to that signingConfig
      #   • make versionCode / versionName injectable via -P flags
      - name: Patch build.gradle for release signing
        working-directory: apps/mobile/android
        run: |
          python3 - <<'PYEOF'
          import re

          path = "app/build.gradle"
          with open(path) as f:
              src = f.read()

          # 1. Make versionCode / versionName Gradle-property-driven.
          src = re.sub(
              r"versionCode\s+\d+",
              "versionCode (findProperty('versionCode') ?: 1).toInteger()",
              src,
          )
          src = re.sub(
              r'versionName\s+"[^"]+"',
              "versionName (findProperty('versionName') ?: '1.0.0')",
              src,
          )

          # 2. Inject release signingConfig block inside signingConfigs { }.
          release_cfg = """
              release {
                  storeFile file(findProperty('SPLITSYNC_STORE_FILE') ?: 'debug.keystore')
                  storePassword findProperty('SPLITSYNC_STORE_PASSWORD') ?: ''
                  keyAlias findProperty('SPLITSYNC_KEY_ALIAS') ?: ''
                  keyPassword findProperty('SPLITSYNC_KEY_PASSWORD') ?: ''
              }"""

          def inject_signing_config(m):
              inner = m.group(1)
              if "release {" not in inner:
                  inner = inner.rstrip() + release_cfg + "\n    "
              return "signingConfigs {" + inner + "}"

          src = re.sub(
              r"signingConfigs \{(.*?)\}",
              inject_signing_config,
              src,
              flags=re.DOTALL,
          )

          # 3. In the release buildType, switch from debug to release signingConfig.
          # The debug buildType also references signingConfigs.debug, so we target
          # only the LAST occurrence — which is always the release buildType.
          marker = "signingConfig signingConfigs.debug"
          replacement = "signingConfig signingConfigs.release"
          last_idx = src.rfind(marker)
          if last_idx != -1:
              src = src[:last_idx] + replacement + src[last_idx + len(marker):]

          with open(path, "w") as f:
              f.write(src)

          print("build.gradle patched OK")
          PYEOF

      # Write signing vars into gradle.properties (file is in .gitignore, never committed).
      - name: Inject signing vars into gradle.properties
        working-directory: apps/mobile/android
        run: |
          cat >> gradle.properties <<EOF
          SPLITSYNC_STORE_FILE=$RUNNER_TEMP/splitsync-upload.keystore
          SPLITSYNC_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}
          SPLITSYNC_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          SPLITSYNC_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # Read versionName from package.json so it stays in sync with the JS package version.
      - name: Read version name
        id: ver
        run: |
          echo "name=$(node -p "require('./apps/mobile/package.json').version")" \
            >> "$GITHUB_OUTPUT"

      - name: Build release .aab
        working-directory: apps/mobile/android
        run: |
          ./gradlew bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.ver.outputs.name }}

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: org.splitsync.tracker
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # Keep the .aab as a workflow artifact for 30 days (audit / manual sideload).
      - name: Archive .aab
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splitsync-tracker-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
